let score=0;
let answered=0;

const quiz=document.getElementById("quiz");

questions.forEach((item,index)=>{

const card=document.createElement("div");

card.className="card question";

card.innerHTML=`

<h3>
Question ${index+1} of ${questions.length}
</h3>

<p><strong>${item.q}</strong></p>

<div id="options${index}"></div>

<div id="result${index}" class="result"></div>

`;

quiz.appendChild(card);

const optionsBox=document.getElementById("options"+index);

item.options.forEach((option,optIndex)=>{

const btn=document.createElement("button");

btn.className="option";

btn.innerText=
String.fromCharCode(65+optIndex)+". "+option;

btn.onclick=()=>checkAnswer(
index,
optIndex,
btn,
optionsBox
);

optionsBox.appendChild(btn);

});

});


function checkAnswer(qIndex,selected,button,box){

const result=
document.getElementById("result"+qIndex);

if(result.dataset.done==="true"){
return;
}

result.dataset.done="true";

answered++;

const correct=
questions[qIndex].answer;

const buttons=
box.querySelectorAll(".option");

buttons.forEach((btn,i)=>{

btn.disabled=true;

if(i===correct){
btn.classList.add("correct");
}

});

if(selected===correct){

score++;

result.className="result right";

result.innerHTML=
"✅ <strong>RIGHT!</strong><br>"+
"<div class='explanation'>"+
"<strong>Explanation:</strong> "+
questions[qIndex].exp+
"</div>";

}else{

button.classList.add("wrong");

result.className="result wrongText";

result.innerHTML=
"❌ <strong>WRONG!</strong><br>"+
"<div class='explanation'>"+
"<strong>Correct Answer:</strong> "+
questions[qIndex].options[correct]+
"<br><strong>Explanation:</strong> "+
questions[qIndex].exp+
"</div>";

}

result.style.display="block";

updateProgress();

if(answered===questions.length){

showFinal();

}

}


function updateProgress(){

document.getElementById("progress").innerText=
"Answered: "+
answered+
" / "+
questions.length+
" | Score: "+
score;

}


function showFinal(){

document.getElementById("finalScore").innerText=
score+" / "+questions.length;

let percent=
Math.round((score/questions.length)*100);

let message="";

if(percent>=90){

message="🏆 Excellent! You have mastered Unit 2.";

}else if(percent>=75){

message="👏 Very Good! Keep reviewing the difficult topics.";

}else if(percent>=50){

message="👍 Good effort! Review the notes and try again.";

}else{

message="📖 Keep studying! Read the Unit 2 notes carefully and try again.";

}

document.getElementById("message").innerText=
percent+"% — "+message;

}
