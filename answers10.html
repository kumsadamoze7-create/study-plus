<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 10 Math Answers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .answer {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        .correct {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🏆 Grade 10 Math Answers</h1>
    <p>Study Plus</p>
</header>

<div class="answer">
    <h3>1. If x + 5 = 12, what is x?</h3>
    <p class="correct">✅ Answer: 7</p>
</div>

<div class="answer">
    <h3>2. If x - 3 = 7, what is x?</h3>
    <p class="correct">✅ Answer: 10</p>
</div>

<div class="answer">
    <h3>3. What is 5 × 6?</h3>
    <p class="correct">✅ Answer: 30</p>
</div>

<div class="answer">
    <h3>4. What is 20 ÷ 5?</h3>
    <p class="correct">✅ Answer: 4</p>
</div>

<div class="answer">
    <h3>5. If 2x = 10, what is x?</h3>
    <p class="correct">✅ Answer: 5</p>
</div>

</body>
</html>
