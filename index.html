<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Study Plus</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:35px 20px;
    border-radius:0 0 28px 28px;
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:20px;
    background:white;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    box-shadow:0 5px 15px #0003;
}

header h1{
    margin:15px 0 5px;
    font-size:32px;
}

header p{
    margin:5px 0;
    opacity:.9;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* SECTION TITLE */

.section-title{
    font-size:22px;
    margin:10px 0 15px;
    color:#172554;
}

/* CARDS */

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:18px;
    box-shadow:0 4px 12px #0002;
}

.card h2{
    margin:0 0 8px;
}

.card p{
    color:#666;
    line-height:1.5;
}

/* GRADE BUTTONS */

.grade{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px;
    margin:12px 0;
    border-radius:15px;
    color:white;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 10px #0002;
}

.grade span{
    font-size:17px;
}

.grade-icon{
    font-size:28px;
}

.grade9{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
}

.grade10{
    background:linear-gradient(135deg,#7c3aed,#9333ea);
}

.grade11{
    background:linear-gradient(135deg,#059669,#10b981);
}

.grade12{
    background:linear-gradient(135deg,#dc2626,#f43f5e);
}

/* MAIN MENU */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.menu button{
    border:none;
    padding:20px 10px;
    border-radius:16px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 10px #0002;
}

.menu button:hover{
    opacity:.9;
}

.notes{
    background:#7c3aed;
}

.practice{
    background:#16a34a;
}

.exam{
    background:#ea580c;
}

.home{
    background:#2563eb;
}

/* BOTTOM NAVIGATION */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    padding:10px 5px;
    box-shadow:0 -3px 10px #0002;
}

.bottom-nav button{
    border:none;
    background:none;
    font-size:12px;
    color:#555;
    cursor:pointer;
}

.bottom-nav .active{
    color:#2563eb;
    font-weight:bold;
}

.nav-icon{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

/* FOOTER SPACE */

.footer-space{
    height:75px;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:28px;
    }

    .menu{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="logo">
    📚
</div>

<h1>Study Plus</h1>

<p>Learn • Practice • Prepare</p>

</header>


<div class="container">


<!-- GRADES -->

<h2 class="section-title">
🎓 Choose Your Grade
</h2>


<div class="card">


<div
class="grade grade9"
onclick="location.href='grade9.html'">

<span>
📘 Grade 9
</span>

<span class="grade-icon">
→
</span>

</div>


<div
class="grade grade10"
onclick="location.href='grade10.html'">

<span>
📗 Grade 10
</span>

<span class="grade-icon">
→
</span>

</div>


<div
class="grade grade11"
onclick="location.href='grade11.html'">

<span>
📙 Grade 11
</span>

<span class="grade-icon">
→
</span>

</div>


<div
class="grade grade12"
onclick="location.href='grade12.html'">

<span>
📕 Grade 12
</span>

<span class="grade-icon">
→
</span>

</div>


</div>


<!-- QUICK ACCESS -->

<h2 class="section-title">
⚡ Quick Access
</h2>


<div class="card">


<div class="menu">


<button
class="notes"
onclick="openNotes()">

📖
<br>
Notes

</button>


<button
class="practice"
onclick="openPractice()">

📝
<br>
Practice

</button>


<button
class="exam"
onclick="openExam()">

🎯
<br>
P. Exam

</button>


<button
class="home"
onclick="location.href='index.html'">

🏠
<br>
Home

</button>


</div>

</div>


<!-- ABOUT -->

<div class="card">

<h2>
📚 Study Plus
</h2>

<p>
Study Plus is an educational platform designed
to help students learn, practice and prepare
for examinations from Grade 9 to Grade 12.
</p>

</div>


<div class="footer-space"></div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">


<button
class="active"
onclick="location.href='index.html'">

<span class="nav-icon">🏠</span>
Home

</button>


<button
onclick="openNotes()">

<span class="nav-icon">📖</span>
Notes

</button>


<button
onclick="openPractice()">

<span class="nav-icon">📝</span>
Practice

</button>


<button
onclick="openExam()">

<span class="nav-icon">🎯</span>
Exam

</button>


</div>


<script>


function openNotes(){

    alert(
        "Choose your Grade first, then open Notes."
    );

}


function openPractice(){

    alert(
        "Choose your Grade first, then open Practice."
    );

}


function openExam(){

    alert(
        "Choose your Grade first, then open P. Exam."
    );

}


</script>


</body>

</html>
