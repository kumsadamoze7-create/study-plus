<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Grade 9 Notes - Study Plus</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
    padding-bottom:30px;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:35px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.subject-card{
    background:white;
    margin:18px 0;
    padding:22px;
    border-radius:16px;
    box-shadow:0 3px 10px #ccc;
}

.subject-card h2{
    margin-top:0;
}

.subject-card p{
    color:#555;
    line-height:1.6;
}

.math{
    border-left:6px solid #2563eb;
}

.chemistry{
    border-left:6px solid #9333ea;
}

.biology{
    border-left:6px solid #16a34a;
}

.physics{
    border-left:6px solid #dc2626;
}

.english{
    border-left:6px solid #ea580c;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.mathBtn{
    background:#2563eb;
}

.chemBtn{
    background:#9333ea;
}

.bioBtn{
    background:#16a34a;
}

.physicsBtn{
    background:#dc2626;
}

.englishBtn{
    background:#ea580c;
}

.back{
    background:#172554;
    margin-top:20px;
}

</style>

</head>

<body>


<header>

<h1>📖 Grade 9 Notes</h1>

<p>Study Plus</p>

<p>Choose a subject to study</p>

</header>


<div class="container">


<!-- MATHEMATICS -->

<div class="subject-card math">

<h2>📐 Mathematics</h2>

<p>
Grade 9 Mathematics notes from Unit 1 to Unit 9.
</p>

<button
class="mathBtn"
onclick="location.href='grade9mathsnotes.html'">

📐 Open Mathematics Notes

</button>

</div>


<!-- CHEMISTRY -->

<div class="subject-card chemistry">

<h2>🧪 Chemistry</h2>

<p>
Grade 9 Chemistry notes from Unit 1 to Unit 5.
</p>

<button
class="chemBtn"
onclick="location.href='grade9chemistrynotes.html'">

🧪 Open Chemistry Notes

</button>

</div>


<!-- BIOLOGY -->

<div class="subject-card biology">

<h2>🧬 Biology</h2>

<p>
Grade 9 Biology notes.
</p>

<button
class="bioBtn"
onclick="location.href='grade9biologynotes.html'">

🧬 Open Biology Notes

</button>

</div>


<!-- PHYSICS -->

<div class="subject-card physics">

<h2>⚡ Physics</h2>

<p>
Grade 9 Physics notes.
</p>

<button
class="physicsBtn"
onclick="location.href='grade9physicsnotes.html'">

⚡ Open Physics Notes

</button>

</div>


<!-- ENGLISH -->

<div class="subject-card english">

<h2>🇬🇧 English</h2>

<p>
Grade 9 English notes.
</p>

<button
class="englishBtn"
onclick="location.href='grade9englishnotes.html'">

🇬🇧 Open English Notes

</button>

</div>


<!-- BACK -->

<button
class="back"
onclick="location.href='index.html'">

← Back to Notes

</button>


</div>

</body>

</html>
