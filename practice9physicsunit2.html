<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:28px 15px;
}

.header h1{
    margin:0;
}

.header p{
    margin:8px 0 0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px 100px;
}

.question{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.question h3{
    color:#0d47a1;
    line-height:1.5;
}

.option{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:2px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#e3f2fd;
}

.option.correct{
    background:#c8e6c9;
    border-color:#2e7d32;
    color:#1b5e20;
}

.option.wrong{
    background:#ffcdd2;
    border-color:#c62828;
    color:#b71c1c;
}

.option:disabled{
    cursor:not-allowed;
}

.feedback{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    line-height:1.6;
}

.feedback.right{
    display:block;
    background:#e8f5e9;
    border-left:5px solid #2e7d32;
}

.feedback.wrong{
    display:block;
    background:#ffebee;
    border-left:5px solid #c62828;
}

#scoreBox{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    background:white;
    padding:14px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.2);
    text-align:center;
    font-size:18px;
    font-weight:bold;
    z-index:100;
}

#restart{
    margin-top:8px;
    padding:9px 20px;
    border:none;
    border-radius:8px;
    background:#0d47a1;
    color:white;
    cursor:pointer;

let score = 0;
let answered = 0;

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

    const div = document.createElement("div");

    div.className = "question";

    let html = `
        <h3>${index+1}. ${q.q}</h3>
    `;

    q.o.forEach((option,i)=>{

        html += `
        <button
        class="option"
        onclick="answer(${index},${i},this)">
        ${String.fromCharCode(65+i)}. ${option}
        </button>
        `;

    });

    html += `
        <div id="feedback${index}" class="feedback">
        </div>
    `;

    div.innerHTML = html;

    quiz.appendChild(div);
});


function answer(questionIndex,selected,button){

    const q = questions[questionIndex];

    const buttons =
        button.parentElement.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    const feedback =
        document.getElementById("feedback"+questionIndex);

    if(selected === q.a){

        button.classList.add("correct");

        feedback.className =
            "feedback right";

        feedback.innerHTML = `
            <strong>✅ RIGHT!</strong>
            <br>
            <b>Correct Answer:</b>
            ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}
            <br><br>
            <b>Explanation:</b>
            ${q.e}
        `;

        score++;

    }else{

        button.classList.add("wrong");

        buttons[q.a].classList.add("correct");

        feedback.className =
            "feedback wrong";

        feedback.innerHTML = `
            <strong>❌ WRONG!</strong>
            <br>
            <b>Correct Answer:</b>
            ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}
            <br><br>
            <b>Explanation:</b>
            ${q.e}
        `;
    }

    answered++;

    document.getElementById("score").innerText = score;

    document.getElementById("answered").innerText = answered;

    feedback.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });

    if(answered === 60){

        setTimeout(()=>{

            alert(
                "🎉 Quiz Completed!\n\n" +
                "Your Score: " +
                score +
                " / 60"
            );

        },500);
    }
}
