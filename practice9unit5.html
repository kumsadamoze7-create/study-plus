let score=0;
let answered=0;

function showQuestions(){

const box=document.getElementById("questions");

questions.forEach((item,index)=>{

const num=index+1;

let html=`
<div class="question">
<h3>${num}. ${item.q}</h3>
`;

item.o.forEach((option,i)=>{

html+=`
<button class="option"
onclick="checkAnswer(${num},${i},this)">
${String.fromCharCode(65+i)}. ${option}
</button>
`;

});

html+=`
<div id="result${num}" class="result"></div>
</div>
`;

box.innerHTML+=html;

});

}

function checkAnswer(num,selected,button){

if(button.disabled) return;

const item=questions[num-1];

const parent=button.parentElement;

const buttons=parent.querySelectorAll(".option");

buttons.forEach(btn=>{
btn.disabled=true;
});

const result=document.getElementById("result"+num);

answered++;

if(selected===item.a){

score++;

result.className="result right";

result.innerHTML=`
<strong>✅ RIGHT!</strong>
<div class="explanation">
<b>Explanation:</b><br>
${item.e}
</div>
`;

}else{

result.className="result wrong";

const correct=String.fromCharCode(65+item.a);

result.innerHTML=`
<strong>❌ WRONG!</strong><br><br>
<b>Correct Answer: ${correct}. ${item.o[item.a]}</b>

<div class="explanation">
<b>Explanation:</b><br>
${item.e}
</div>
`;

}

document.getElementById("score").innerHTML=
`Score: ${score} / 60`;

if(answered===60){

const percentage=(score/60)*100;

const finish=document.getElementById("finish");

finish.style.display="block";

finish.innerHTML=`
🎉 <b>Practice Completed!</b>
<br><br>
Score: ${score} / 60
<br>
Percentage: ${percentage.toFixed(1)}%
`;

}

}
