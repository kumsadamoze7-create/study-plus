body{

header{

let score = 0;
let answered = 0;

function loadQuiz(){

    const quiz = document.getElementById("quiz");

    questions.forEach((item,index)=>{

        const card = document.createElement("div");

        card.className = "card question";

        let html = `
        <h3>${item.q}</h3>
        `;

        item.a.forEach((option,optionIndex)=>{

            html += `
            <button
            class="option"
            id="q${index}o${optionIndex}"
            onclick="checkAnswer(${index},${optionIndex})">

            ${String.fromCharCode(65+optionIndex)}. ${option}

            </button>
            `;

        });

        html += `
        <div
        id="result${index}"
        class="result">
        </div>
        `;

        card.innerHTML = html;

        quiz.appendChild(card);

    });

}


function checkAnswer(questionIndex,selectedIndex){

    const question = questions[questionIndex];

    const result = document.getElementById(
        "result"+questionIndex
    );

    if(result.style.display === "block"){
        return;
    }

    answered++;

    const selectedButton =
        document.getElementById(
            `q${questionIndex}o${selectedIndex}`
        );

    const correctButton =
        document.getElementById(
            `q${questionIndex}o${question.c}`
        );


    if(selectedIndex === question.c){

        score++;

        selectedButton.classList.add("correct");

        result.className = "result right";

        result.innerHTML = `
        <strong>✅ RIGHT!</strong><br>
        ${question.e}
        `;

    }else{

        selectedButton.classList.add("wrong");

        correctButton.classList.add("correct");

        result.className = "result wrongResult";

        result.innerHTML = `
        <strong>❌ WRONG!</strong><br>
        <strong>Correct Answer:</strong>
        ${String.fromCharCode(65+question.c)}. ${question.a[question.c]}
        <br><br>
        <strong>📖 Explanation:</strong>
        ${question.e}
        `;

    }

    result.style.display = "block";

    document.getElementById("score").innerHTML =
        `${score} / 60`;

}


loadQuiz();
