<script>
const questions = [{"q": "Although he is tired, he usually _____ his assignments before dinner.", "options": ["finish", "finishes", "is finishing", "has finished"], "answer": 1, "explain": "“Usually” shows a habitual action. With he, the Simple Present takes -s: finishes."}, {"q": "Water _____ at 100°C at standard atmospheric pressure.", "options": ["boil", "boils", "is boiling", "has boiled"], "answer": 1, "explain": "A scientific fact uses the Simple Present: boils."}, {"q": "Neither the teacher nor the students _____ the answer to this question.", "options": ["know", "knows", "are knowing", "has known"], "answer": 0, "explain": "In this construction, the nearer plural subject “students” controls the verb: know."}, {"q": "How often _____ your brother _____ the laboratory?", "options": ["does / visit", "is / visiting", "has / visited", "did / visit"], "answer": 0, "explain": "A routine question uses does + subject + base verb: does your brother visit."}, {"q": "The Earth _____ around the Sun, although the stars _____ to move across the sky.", "options": ["moves / seem", "is moving / are seeming", "moved / seemed", "has moved / seem"], "answer": 0, "explain": "General truths use the Simple Present: moves and seem."}, {"q": "She rarely _____ coffee because it _____ her unable to sleep.", "options": ["drink / make", "drinks / makes", "is drinking / is making", "has drunk / has made"], "answer": 1, "explain": "“Rarely” indicates habit; she requires drinks and makes."}, {"q": "Every time the alarm _____, the students _____ their books.", "options": ["rings / open", "is ringing / are opening", "rang / opened", "has rung / have opened"], "answer": 0, "explain": "Repeated events use the Simple Present: rings and open."}, {"q": "What _____ this word _____ in this context?", "options": ["does / mean", "is / meaning", "has / meant", "did / mean"], "answer": 0, "explain": "Meaning is a state/general fact here, so use does + base verb: does mean."}, {"q": "My father _____ to work by bus unless he _____ late.", "options": ["go / gets", "goes / gets", "is going / is getting", "has gone / has got"], "answer": 1, "explain": "Regular routines use the Simple Present: goes and gets."}, {"q": "The library _____ at 8:00 and _____ at 6:00 every weekday.", "options": ["opens / closes", "is opening / is closing", "opened / closed", "has opened / has closed"], "answer": 0, "explain": "A fixed regular schedule can use the Simple Present: opens, closes."}, {"q": "I understand why she _____ the rule, but I _____ with her conclusion.", "options": ["reject / do not agree", "rejects / do not agree", "is rejecting / am not agreeing", "has rejected / have not agreed"], "answer": 1, "explain": "“She” takes rejects; agree is a stative verb here, so do not agree."}, {"q": "If the temperature _____ below zero, water _____ into ice.", "options": ["falls / freezes", "is falling / is freezing", "fell / froze", "has fallen / has frozen"], "answer": 0, "explain": "General conditions/facts use the Simple Present: falls and freezes."}, {"q": "The coach _____ that every player _____ on time.", "options": ["expects / arrives", "is expecting / is arriving", "expected / arrived", "has expected / has arrived"], "answer": 0, "explain": "A current general expectation uses Simple Present."}, {"q": "My sister _____ mathematics better than she _____ physics.", "options": ["understand / understand", "understands / understands", "is understanding / is understanding", "has understood / has understood"], "answer": 1, "explain": "Understand is stative; with singular subject use understands."}, {"q": "The examination _____ at nine, so students _____ to arrive by eight-thirty.", "options": ["starts / need", "is starting / are needing", "started / needed", "has started / have needed"], "answer": 0, "explain": "An official timetable can use Simple Present: starts; need is also stative."}, {"q": "He never _____ his phone during class because the school _____ this behavior.", "options": ["uses / prohibits", "is using / is prohibiting", "used / prohibited", "has used / has prohibited"], "answer": 0, "explain": "“Never” and school rules indicate habitual/general actions: uses, prohibits."}, {"q": "Be quiet! The students _____ an experiment that requires concentration.", "options": ["conduct", "conducted", "are conducting", "have conducted"], "answer": 2, "explain": "“Be quiet!” indicates an action happening now: are conducting."}, {"q": "Why _____ you _____ at me like that?", "options": ["do / look", "are / looking", "have / looked", "did / look"], "answer": 1, "explain": "The action is happening now, so use are + looking."}, {"q": "This week, our class _____ a different laboratory procedure.", "options": ["learns", "learned", "is learning", "has learned"], "answer": 2, "explain": "“This week” can describe a temporary activity in progress: is learning."}, {"q": "I cannot answer the phone because I _____.", "options": ["drive", "drove", "am driving", "have driven"], "answer": 2, "explain": "The action is happening at the moment: am driving."}, {"q": "More students _____ online courses this year than before.", "options": ["take", "took", "are taking", "have taken"], "answer": 2, "explain": "“This year” describes a developing current trend: are taking."}, {"q": "Why _____ the machine _____ so loudly today?", "options": ["does / make", "is / making", "has / made", "did / make"], "answer": 1, "explain": "“Today” and the current noise indicate Present Continuous."}, {"q": "Look at those clouds! It _____.", "options": ["rains", "rained", "is raining", "has rained"], "answer": 2, "explain": "“Look!” points to an action occurring now: is raining."}, {"q": "She _____ with her aunt this month while her house is being repaired.", "options": ["stays", "stayed", "is staying", "has stayed"], "answer": 2, "explain": "A temporary situation around now uses Present Continuous."}, {"q": "The teacher _____ the students how to use the new software right now.", "options": ["shows", "showed", "is showing", "has shown"], "answer": 2, "explain": "“Right now” is a direct Present Continuous signal."}, {"q": "I _____ more carefully these days because the final exam is approaching.", "options": ["study", "studied", "am studying", "have studied"], "answer": 2, "explain": "“These days” can indicate a temporary current activity: am studying."}, {"q": "Why _____ they _____ the meeting to another room?", "options": ["do / move", "are / moving", "have / moved", "did / move"], "answer": 1, "explain": "The decision/action is happening around now: are moving."}, {"q": "The number of students using the library _____ rapidly this semester.", "options": ["increases", "increased", "is increasing", "has increased"], "answer": 2, "explain": "A current developing trend uses Present Continuous."}, {"q": "He _____ unusually quiet today.", "options": ["is", "was", "has been", "does be"], "answer": 0, "explain": "The adjective “quiet” describes a current state; “is” is the correct present form."}, {"q": "We _____ for the bus at the moment, so we cannot leave.", "options": ["wait", "waited", "are waiting", "have waited"], "answer": 2, "explain": "“At the moment” requires Present Continuous."}, {"q": "The children _____ in the garden while their parents prepare lunch.", "options": ["play", "played", "are playing", "have played"], "answer": 2, "explain": "The action is occurring now: are playing."}, {"q": "I _____ for a new apartment these days.", "options": ["look", "looked", "am looking", "have looked"], "answer": 2, "explain": "“These days” indicates a temporary activity around the present."}, {"q": "She _____ three chapters of the book so far.", "options": ["reads", "read", "has read", "is reading"], "answer": 2, "explain": "“So far” connects a completed amount to the present: has read."}, {"q": "Have you _____ the laboratory report yet?", "options": ["finish", "finished", "finishing", "finishes"], "answer": 1, "explain": "Present Perfect uses have/has + past participle: finished."}, {"q": "They _____ never _____ such a difficult experiment before.", "options": ["have / seen", "are / seeing", "did / see", "will / see"], "answer": 0, "explain": "“Never” + life experience uses Present Perfect: have seen."}, {"q": "I _____ my keys, so I cannot open the door.", "options": ["lose", "lost", "have lost", "am losing"], "answer": 2, "explain": "The past action has a present result: have lost."}, {"q": "We _____ already _____ the problem.", "options": ["have / solved", "are / solving", "did / solve", "will / solve"], "answer": 0, "explain": "“Already” commonly signals Present Perfect for a recently completed action."}, {"q": "How many countries _____ you _____ so far?", "options": ["did / visit", "have / visited", "are / visiting", "will / visit"], "answer": 1, "explain": "“So far” requires Present Perfect: have visited."}, {"q": "He _____ just _____ home.", "options": ["has / arrived", "is / arriving", "did / arrive", "will / arrive"], "answer": 0, "explain": "“Just” indicates a very recent completed action: has arrived."}, {"q": "The teacher _____ the results yet.", "options": ["has not announced", "does not announce", "is not announcing", "did not announce"], "answer": 0, "explain": "“Yet” in a negative sentence commonly uses Present Perfect."}, {"q": "I _____ this movie twice, but I still do not understand the ending.", "options": ["see", "saw", "have seen", "am seeing"], "answer": 2, "explain": "Repeated experience without a finished-time expression uses Present Perfect."}, {"q": "She _____ all the required documents.", "options": ["submits", "submitted", "has submitted", "is submitting"], "answer": 2, "explain": "The completed action is relevant now; Present Perfect is appropriate."}, {"q": "Have they _____ the new equipment?", "options": ["receive", "received", "receiving", "receives"], "answer": 1, "explain": "Have + V3 gives Present Perfect: received."}, {"q": "The students _____ a lot of progress this term.", "options": ["make", "made", "have made", "are making"], "answer": 2, "explain": "“This term” is an unfinished time period; Present Perfect fits."}, {"q": "I _____ never _____ a more confusing question.", "options": ["have / answered", "did / answer", "am / answering", "will / answer"], "answer": 0, "explain": "“Never” describing experience takes Present Perfect."}, {"q": "She _____ her homework, so she can go outside.", "options": ["finishes", "finished", "has finished", "is finishing"], "answer": 2, "explain": "The completed homework has a present consequence: has finished."}, {"q": "How long _____ you _____ this book?", "options": ["have / read", "did / read", "are / reading", "will / read"], "answer": 0, "explain": "For an action continuing up to now, Present Perfect can be used; have read is the intended form."}, {"q": "We _____ several mistakes in the first draft, but we have corrected them.", "options": ["make", "made", "have made", "are making"], "answer": 2, "explain": "The mistakes occurred during the current process and matter now: have made."}, {"q": "She _____ for two hours, and she still has three pages to write.", "options": ["studies", "studied", "has been studying", "is studying"], "answer": 2, "explain": "A duration continuing to now is emphasized: has been studying."}, {"q": "I _____ for you since 7:00 a.m.", "options": ["wait", "waited", "have been waiting", "am waiting"], "answer": 2, "explain": "“Since 7:00” + continuing duration requires Present Perfect Continuous."}, {"q": "Why are your hands dirty? — I _____.", "options": ["paint", "painted", "have been painting", "am painting"], "answer": 2, "explain": "Recent activity with visible present evidence uses Present Perfect Continuous."}, {"q": "They _____ the road for several weeks.", "options": ["repair", "repaired", "have been repairing", "are repairing"], "answer": 2, "explain": "“For several weeks” emphasizes an ongoing activity up to now."}, {"q": "How long _____ she _____ for the exam?", "options": ["does / study", "did / study", "has / been studying", "is / study"], "answer": 2, "explain": "“How long” asks about duration continuing to now: has been studying."}, {"q": "It _____ since early morning.", "options": ["rains", "rained", "has been raining", "is raining"], "answer": 2, "explain": "The rain began earlier and continues; Present Perfect Continuous emphasizes duration."}, {"q": "We _____ this problem for half an hour and still cannot solve it.", "options": ["discuss", "discussed", "have been discussing", "are discussing"], "answer": 2, "explain": "“For half an hour” + unfinished activity calls for Present Perfect Continuous."}, {"q": "He _____ at the computer all afternoon.", "options": ["works", "worked", "has been working", "is work"], "answer": 2, "explain": "“All afternoon” emphasizes duration continuing to the present."}, {"q": "The children are tired because they _____ outside for hours.", "options": ["play", "played", "have been playing", "are playing"], "answer": 2, "explain": "Present evidence (tired) from an activity continuing for hours: have been playing."}, {"q": "I _____ English every evening this month.", "options": ["practice", "practiced", "have been practicing", "am practice"], "answer": 2, "explain": "A repeated activity continuing through an unfinished period is naturally expressed with Present Perfect Continuous."}, {"q": "She _____ to contact the company since Monday.", "options": ["tries", "tried", "has been trying", "is trying"], "answer": 2, "explain": "“Since Monday” indicates an ongoing repeated attempt up to now."}, {"q": "The scientist _____ samples all morning.", "options": ["tests", "tested", "has been testing", "is test"], "answer": 2, "explain": "“All morning” emphasizes an activity continuing to the present."}, {"q": "How long _____ they _____ for the bus?", "options": ["have / been waiting", "did / wait", "are / wait", "do / waited"], "answer": 0, "explain": "The correct structure is have + been + V-ing for duration continuing to now."}, {"q": "My brother _____ for his driving test for weeks.", "options": ["prepares", "prepared", "has been preparing", "is prepare"], "answer": 2, "explain": "The activity has continued for weeks and is still relevant now."}, {"q": "The company _____ new workers for several months.", "options": ["trains", "trained", "has been training", "is train"], "answer": 2, "explain": "A continuing activity over several months uses Present Perfect Continuous."}, {"q": "You look exhausted. _____ you _____ all night?", "options": ["Did / study", "Have / been studying", "Are / study", "Do / studied"], "answer": 1, "explain": "Present result (exhaustion) from recent continuous activity: Have you been studying?"}, {"q": "She _____ the experiment yesterday and recorded the results.", "options": ["conducts", "conducted", "has conducted", "is conducting"], "answer": 1, "explain": "“Yesterday” is a finished past time, so use Simple Past."}, {"q": "When did you _____ the message?", "options": ["receive", "received", "receiving", "receives"], "answer": 0, "explain": "After did, use the base verb: receive."}, {"q": "He _____ to Addis Ababa last month.", "options": ["travels", "traveled", "has traveled", "is traveling"], "answer": 1, "explain": "“Last month” is a finished past period: traveled."}, {"q": "The teacher _____ the question, but nobody answered.", "options": ["repeats", "repeated", "has repeated", "is repeating"], "answer": 1, "explain": "A completed past event uses Simple Past: repeated."}, {"q": "I _____ my homework before I went to bed.", "options": ["finish", "finished", "have finished", "am finishing"], "answer": 1, "explain": "Both actions are completed in the past; Simple Past is possible here."}, {"q": "They _____ the match two days ago.", "options": ["win", "won", "have won", "are winning"], "answer": 1, "explain": "“Two days ago” requires Simple Past: won."}, {"q": "Did she _____ the correct answer?", "options": ["gave", "give", "giving", "gives"], "answer": 1, "explain": "After did, use V1: give."}, {"q": "We _____ not understand the instructions at first.", "options": ["do", "did", "have", "are"], "answer": 1, "explain": "Simple Past negative uses did not + base verb: did not understand."}, {"q": "The students _____ quietly during the examination.", "options": ["work", "worked", "have worked", "are working"], "answer": 1, "explain": "A completed examination period in the past uses Simple Past."}, {"q": "He _____ the door and walked outside.", "options": ["opens", "opened", "has opened", "is opening"], "answer": 1, "explain": "A sequence of completed past actions uses Simple Past."}, {"q": "Where _____ you _____ last Saturday?", "options": ["did / go", "do / go", "have / gone", "are / going"], "answer": 0, "explain": "A finished past time requires did + base verb."}, {"q": "The scientist _____ an important discovery in 1928.", "options": ["makes", "made", "has made", "is making"], "answer": 1, "explain": "A specific historical year uses Simple Past."}, {"q": "I _____ him at the station yesterday.", "options": ["meet", "met", "have met", "am meeting"], "answer": 1, "explain": "“Yesterday” requires Simple Past: met."}, {"q": "She _____ the book but did not understand the final chapter.", "options": ["reads", "read", "has read", "is reading"], "answer": 1, "explain": "The reading was completed in the past; Simple Past is used."}, {"q": "The machine _____ suddenly during the experiment.", "options": ["stops", "stopped", "has stopped", "is stopping"], "answer": 1, "explain": "A completed past event uses stopped."}, {"q": "They _____ the old building last year.", "options": ["demolish", "demolished", "have demolished", "are demolishing"], "answer": 1, "explain": "“Last year” is a finished past period."}, {"q": "At 8 p.m. yesterday, I _____ for the examination.", "options": ["study", "studied", "was studying", "have studied"], "answer": 2, "explain": "A specific time in the past with an action in progress requires Past Continuous."}, {"q": "While she _____ dinner, the phone rang.", "options": ["cooked", "was cooking", "has cooked", "will cook"], "answer": 1, "explain": "“While” commonly introduces an ongoing past action: was cooking."}, {"q": "They _____ football when it suddenly started to rain.", "options": ["played", "were playing", "have played", "will play"], "answer": 1, "explain": "The football action was in progress when another event interrupted it."}, {"q": "What _____ you _____ at midnight?", "options": ["did / do", "were / doing", "have / done", "will / do"], "answer": 1, "explain": "A question about an action in progress at a past time uses were + V-ing."}, {"q": "I saw him while he _____ across the road.", "options": ["walked", "was walking", "has walked", "will walk"], "answer": 1, "explain": "Walking was in progress when I saw him."}, {"q": "The students _____ when the teacher entered.", "options": ["talked", "were talking", "have talked", "will talk"], "answer": 1, "explain": "The talking was already in progress when the teacher entered."}, {"q": "At this time last week, we _____ in the laboratory.", "options": ["worked", "were working", "have worked", "will work"], "answer": 1, "explain": "“At this time last week” signals Past Continuous."}, {"q": "She _____ when I called her.", "options": ["slept", "was sleeping", "has slept", "will sleep"], "answer": 1, "explain": "Sleeping was in progress at the moment of the call."}, {"q": "While the scientist _____ the sample, the assistant recorded the data.", "options": ["examined", "was examining", "has examined", "will examine"], "answer": 1, "explain": "The examination was an ongoing background action."}, {"q": "They _____ home when they saw the accident.", "options": ["drove", "were driving", "have driven", "will drive"], "answer": 1, "explain": "Driving was in progress when they saw the accident."}, {"q": "Why _____ he _____ during the lesson?", "options": ["did / sleep", "was / sleeping", "has / slept", "will / sleep"], "answer": 1, "explain": "The question refers to an action in progress during the past lesson."}, {"q": "The rain _____ heavily when we left school.", "options": ["fell", "was falling", "has fallen", "will fall"], "answer": 1, "explain": "Rain was in progress at that past moment: was falling."}, {"q": "I _____ a book while my sister was watching television.", "options": ["read", "was reading", "have read", "will read"], "answer": 1, "explain": "The action was ongoing at the same past time: was reading."}, {"q": "At 6 o'clock, the workers _____ the road.", "options": ["repaired", "were repairing", "have repaired", "will repair"], "answer": 1, "explain": "At a specific past time, an action in progress uses Past Continuous."}, {"q": "When the lights went out, we _____ dinner.", "options": ["ate", "were eating", "have eaten", "will eat"], "answer": 1, "explain": "Dinner was in progress when the lights went out."}, {"q": "The children _____ outside when their mother called them.", "options": ["played", "were playing", "have played", "will play"], "answer": 1, "explain": "The outdoor activity was in progress when the call happened."}, {"q": "When I arrived, the meeting _____ already _____.", "options": ["has / started", "had / started", "was / starting", "will / start"], "answer": 1, "explain": "An earlier past action uses Past Perfect: had started."}, {"q": "She _____ the report before the manager asked for it.", "options": ["finished", "had finished", "has finished", "will finish"], "answer": 1, "explain": "The report was completed before another past action."}, {"q": "By the time we reached the station, the train _____.", "options": ["leaves", "left", "had left", "has left"], "answer": 2, "explain": "The train left before we reached the station: had left."}, {"q": "He was tired because he _____ all the work before lunch.", "options": ["does", "did", "had done", "has done"], "answer": 2, "explain": "The earlier completed work requires Past Perfect."}, {"q": "I realized th king was in progress; the wrong measurement happened earlier, so Past Continuous + Past Perfect."}];
let current=0, score=0, answered=false;
function showQuestion(){
  answered=false;
  const q=questions[current];
  document.getElementById("progress").textContent="Question "+(current+1)+" of "+questions.length;
  let h='<div class="question">'+q.q+'</div>';
  q.options.forEach((o,i)=>h+='<button class="option" onclick="checkAnswer('+i+',this)">'+String.fromCharCode(65+i)+'. '+o+'</button>');
  h+='<div class="explanation" id="explanation"></div>';
  document.getElementById("quiz").innerHTML=h;
  document.getElementById("nextBtn").style.display="none";
}
function checkAnswer(selected,btn){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const box=document.getElementById("explanation");
  if(selected===q.answer){
    btn.classList.add("correct");
    score++;
    box.innerHTML="✅ <b>RIGHT!</b><br><br>💡 <b>Explanation:</b> "+q.explain;
  }else{
    btn.classList.add("wrong");
    buttons[q.answer].classList.add("correct");
    box.innerHTML="❌ <b>WRONG!</b><br><br>✅ <b>Correct answer:</b> "+q.options[q.answer]+"<br><br>💡 <b>Explanation:</b> "+q.explain;
  }
  box.style.display="block";
  document.getElementById("nextBtn").style.display="block";
}
function nextQuestion(){
  current++;
  if(current<questions.length) showQuestion();
  else finish();
}
function finish(){
  document.getElementById("quizCard").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("score").textContent=score+" / "+questions.length;
  let m="";
  if(score>=180)m="🏆 Outstanding! Excellent command of the 12 tenses.";
  else if(score>=160)m="🔥 Excellent work! Your tense control is very strong.";
  else if(score>=140)m="👏 Very good! Review the questions you missed.";
  else if(score>=100)m="👍 Good effort. Review the tense rules and try again.";
  else m="📖 Keep practicing. Review the Unit 1 notes carefully and try again.";
  document.getElementById("message").textContent=m;
}
function restartQuiz(){
  current=0;score=0;
