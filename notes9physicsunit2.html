let score = 0;
let answered = 0;

const quiz = document.getElementById("quiz");

questions.forEach((item,index)=>{

    const box = document.createElement("div");
    box.className = "question";

    let html = `
        <h3>${index+1}. ${item.q}</h3>
        <div class="options">
    `;

    item.options.forEach((option,optIndex)=>{

        html += `
        <button
            class="option"
            onclick="checkAnswer(${index},${optIndex},this)">
            ${String.fromCharCode(65+optIndex)}. ${option}
        </button>
        `;

    });

    html += `
        </div>

        <div id="feedback-${index}" class="feedback">
            <strong id="result-${index}"></strong>
            <div>
                <b>Explanation:</b>
                ${item.explain}
            </div>
        </div>
    `;

    box.innerHTML = html;
    quiz.appendChild(box);

});


function checkAnswer(questionIndex,selected,button){

    const question = questions[questionIndex];

    const parent = button.parentElement;
    const buttons = parent.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    const feedback =
        document.getElementById("feedback-"+questionIndex);

    const result =
        document.getElementById("result-"+questionIndex);

    if(selected === question.answer){

        button.classList.add("correct");

        result.innerHTML =
            "✅ RIGHT! Correct Answer";

        feedback.className =
            "feedback right";

        score++;

    }else{

        button.classList.add("wrong");

        buttons[question.answer].classList.add("correct");

        result.innerHTML =
            "❌ WRONG! Correct Answer: " +
            String.fromCharCode(65+question.answer) +
            ". " +
            question.options[question.answer];

        feedback.className =
            "feedback wrong-feedback";
    }

    answered++;

    document.getElementById("score").innerText = score;

    if(answered === 60){

        setTimeout(()=>{

            alert(
                "🎉 Quiz Completed!\n\nYour Score: " +
                score +
                " / 60"
            );

        },300);

    }

    feedback.scrollIntoView({
        behavior:"smooth",
        block:"nearest"
    });
}
