options:[

options:[

answer:1,

{
q:"18. What is an inclined plane?",
options:[

],
answer:0,
explanation:"An inclined plane is a sloping surface used to move objects between different heights."

q:"19. Which is an example of an inclined plane?",
options:[

options:[

q:"22. Which is an example of a wheel and axle?",

options:[

],
answer:0,

{
q:"25. A wedge is commonly used for:",
options:[

],
answer:0,

{
q:"26. A screw can be considered as:",
options:[

"A lever without a fulcrum",

],
answer:0,
explanation:"A screw is essentially an inclined plane wrapped around a cylinder."
},

{
q:"27. Which is an example of a screw?",
options:[
"Wood screw",
"Seesaw",
"Ramp",
"Knife"
],
answer:0,
explanation:"A wood screw is a common example of a screw simple machine."
},

{
q:"28. What does mechanical advantage tell us?",
options:[
"How much a machine multiplies effort",
"The temperature of a machine",
"The mass of a machine",
"The time of operation"
],
answer:0,
explanation:"Mechanical advantage compares the load to the effort and shows how much the machine multiplies the applied effort."
},

{
q:"29. What is the formula for mechanical advantage?",
options:[
"MA = Effort / Load",
"MA = Load / Effort",
"MA = Load × Effort",
"MA = Load + Effort"
],
answer:1,
explanation:"Mechanical advantage is calculated using MA = Load / Effort."
},

{
q:"30. A machine lifts a 200 N load using 50 N effort. What is its MA?",
options:[
"2",
"4",
"5",
"10"
],
answer:1,
explanation:"MA = Load / Effort = 200 / 50 = 4."
},

{
q:"31. If load = 600 N and effort = 100 N, MA is:",
options:[
"3",
"6",
"60",
"600"
],
answer:1,
explanation:"MA = 600 / 100 = 6."
},

{
q:"32. If MA is greater than 1, the machine generally:",
options:[
"Multiplies the applied effort",
"Destroys energy",
"Has no load",
"Cannot do work"
],
answer:0,
explanation:"An MA greater than 1 means the output load force is greater than the input effort force."
},

{
q:"33. What does velocity ratio compare?",
options:[
"Mass and force",
"Distance moved by effort and load",
"Time and mass",
"Energy and power"
],
answer:1,
explanation:"Velocity ratio is the distance moved by the effort divided by the distance moved by the load."
},

{
q:"34. What is the formula for velocity ratio?",
options:[
"VR = Load / Effort",
"VR = Effort distance / Load distance",
"VR = Effort × Load",
"VR = Load distance / Effort distance"
],
answer:1,
explanation:"VR = distance moved by effort / distance moved by load."
},

{
q:"35. The effort moves 4 m and the load moves 1 m. What is VR?",
options:[
"1",
"2",
"4",
"5"
],
answer:2,
explanation:"VR = 4 / 1 = 4."
},

{
q:"36. A machine has an effort distance of 6 m and load distance of 2 m. VR is:",
options:[
"2",
"3",
"4",
"8"
],
answer:1,
explanation:"VR = 6 / 2 = 3."
},

{
q:"37. What does efficiency measure?",
options:[
"How effectively a machine converts input work into useful output work",
"Only the mass of the machine",
"The color of the machine",
"The length of the machine"
],
answer:0,
explanation:"Efficiency measures how much of the input work becomes useful output work."
},

{
q:"38. What is the formula for efficiency using work?",
options:[
"Efficiency = Input / Output × 100",
"Efficiency = Output / Input × 100",
"Efficiency = Input + Output",
"Efficiency = Output − Input"
],
answer:1,
explanation:"Efficiency = (useful output work / input work) × 100%."
},

{
q:"39. What is the efficiency of an ideal machine?",
options:[
"0%",
"50%",
"75%",
"100%"
],
answer:3,
explanation:"An ideal machine has no energy loss, so its efficiency is 100%."
},

{
q:"40. Why is the efficiency of a real machine less than 100%?",
options:[
"Because of energy losses such as friction",
"Because machines create energy",
"Because mass disappears",
"Because gravity stops"
],
answer:0,
explanation:"Real machines lose some input energy, commonly due to friction, sound, heat, and deformation."
},

{
q:"41. Which formula relates efficiency, MA and VR?",
options:[
"Efficiency = MA × VR × 100",
"Efficiency = MA / VR × 100",
"Efficiency = VR / MA × 100",
"Efficiency = MA + VR"
],
answer:1,
explanation:"Efficiency (%) = (MA / VR) × 100."
},

{
q:"42. A machine has MA = 4 and VR = 5. What is its efficiency?",
options:[
"20%",
"40%",
"80%",
"125%"
],
answer:2,
explanation:"Efficiency = (4/5) × 100 = 80%."
},

{
q:"43. A machine has MA = 3 and VR = 4. Efficiency is:",
options:[
"25%",
"50%",
"75%",
"100%"
],
answer:2,
explanation:"Efficiency = (3/4) × 100 = 75%."
},

{
q:"44. Which statement about a real machine is correct?",
options:[
"Its efficiency is normally less than 100%",
"Its efficiency must be 200%",
"It has no friction",
"It creates energy"
],
answer:0,
explanation:"Real machines have energy losses, so their efficiency is normally less than 100%."
},

{
q:"45. Which simple machine is commonly used to draw water from a well?",
options:[

"Wedge",

],
answer:0,
explanation:"A pulley can be used to change the direction of force and help lift a bucket from a well."

q:"46. Which simple machine is commonly used for cutting wood?",
options:[
"Wedge",
"Pulley",

],
answer:0,

},

{
q:"47. Which simple machine is commonly used as a ramp for loading heavy objects?",
options:[

{
q:"48. Which simple machine is commonly found in a steering wheel?",
options:[

answer:0,

},

{
q:"49. Which simple machine is used in a bottle opener?",
options:[
"Second-class lever",
"Third-class lever",

{
q:"50. Which simple machine is represented by scissors?",
options:[
"First-class lever",
"Second-class lever",
"Third-class lever",
"Inclined plane"
],
answer:0,
explanation:"Scissors act as first-class levers because the pivot is between the effort and the load."

options:[
"50 N",
"100 N",
"250 N",
"2500 N"
],
answer:1,

},

q:"52. If MA = 4 and effort = 50 N, what is the load?",
options:[
"12.5 N",
"54 N",
"200 N",

],

},

{
q:"53. If the effort moves 10 m and the load moves 2 m, what is VR?",

"2",
"5",
"8",

],

const quiz = document.getElementById("quiz");

let score = 0;
let answered = 0;


questions.forEach((question,index)=>{

    const card = document.createElement("div");

    card.className = "card question";


    const title = document.createElement("h3");

    title.textContent = question.q;

    card.appendChild(title);


    const result = document.createElement("div");

    result.className = "result";

    result.style.display = "none";


    const explanation = document.createElement("div");

    explanation.className = "explanation";

    explanation.style.display = "none";


    question.options.forEach((option,optionIndex)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.textContent =
        String.fromCharCode(65 + optionIndex) +
        ". " + option;


        button.onclick = function(){

            const buttons =
            card.querySelectorAll(".option");


            buttons.forEach(btn=>{
                btn.disabled = true;
            });


            answered++;


            if(optionIndex === question.answer){

                score++;

                result.className =
                "result correct";

                result.innerHTML =
                "✅ Correct!";

            }else{

                result.className =
                "result wrong";

                result.innerHTML =
                "❌ Wrong! Correct answer: " +
                String.fromCharCode(65 + question.answer) +
                ". " +
                question.options[question.answer];

            }


            result.style.display = "block";


            explanation.innerHTML =
            "<b>💡 Explanation:</b> " +
            question.explanation;

            explanation.style.display = "block";


            if(answered === questions.length){

                showScore();

            }

        };


        card.appendChild(button);

    });


    card.appendChild(result);

    card.appendChild(explanation);

    quiz.appendChild(card);

});


function showScore(){

    const scoreBox =
    document.getElementById("score");

    const scoreText =
    document.getElementById("scoreText");


    const percentage =
    Math.round((score / questions.length) * 100);


    scoreText.innerHTML =
    "Your Score: <b>" +
    score +
    " / " +
    questions.length +
    "</b><br><br>" +
    "Percentage: <b>" +
    percentage +
    "%</b>";


    scoreBox.style.display = "block";


    scoreBox.scrollIntoView({
        behavior:"smooth"
    });

}
