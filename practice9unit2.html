<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 9 Mathematics - Unit 2 Practice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

#score{
    background:white;
    padding:18px;
    margin:15px 0;
    border-radius:14px;
    box-shadow:0 3px 10px #ccc;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:10;
}

.question{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 10px #ccc;
}

.question h3{
    line-height:1.6;
}

.topic{
    color:#2563eb;
    font-size:14px;
    font-weight:bold;
}

.option{
    display:block;
    width:100%;
    padding:14px;
    margin:9px 0;
    border:2px solid #ddd;
    border-radius:10px;
    background:white;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#eef4ff;
}

.option:disabled{
    cursor:not-allowed;
    opacity:.7;
}

.result{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    line-height:1.7;
}

.right{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.wrong{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.explanation{
    margin-top:10px;
    padding:12px;
    background:#eef4ff;
    color:#222;
    border-radius:8px;
}

#finish{
    display:none;
    background:#2563eb;
    color:white;
    padding:25px;
    border-radius:14px;
    text-align:center;
    font-size:21px;
    margin:25px 0;
}

.back{
    display:block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    margin:25px 0;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🔢 Grade 9 Mathematics</h1>
<p>Unit 2 — The Number System</p>
<p>🔥 60 Entrance / UEE-Style Practice Questions</p>
</header>

<div class="container">

<div id="score">
Score: 0 / 60
</div>

<div id="questions"></div>

<div id="finish"></div>

<a href="maths.html" class="back">
← Back to Mathematics
</a>

</div>

{

q:"Solve |x| = 5.",

},

{

{
topic:"Scientific Notation",
q:"Which is greater?",
o:["3.5×10⁴","4.1×10³","9.9×10²","2×10⁴"],

q:"Round 7.846 to 2 decimal places.",

q:"Round 0.004786 to 3 significant figures.",
o:["0.00478","0.00479","0.00480","0.004786"],

{
topic:"Significant Figures",
q:"How many significant figures are in 0.005060?",
o:["3","4","5","6"],

{

q:"A length is measured as 8.42 cm to the nearest 0.01 cm. What is the maximum absolute error?",
o:["0.1 cm","0.05 cm","0.01 cm","0.005 cm"],
a:3,

{

let score=0;
let answered=0;

function showQuestions(){

    const box=document.getElementById("questions");

    questions.forEach((item,index)=>{

        const num=index+1;

        let html=`
        <div class="question">

        <div class="topic">
        ${item.topic}
        </div>

        <h3>
        ${num}. ${item.q}
        </h3>
        `;

        item.o.forEach((option,i)=>{

            html+=`
            <button
            class="option"
            onclick="checkAnswer(${num},${i},this)">
            ${String.fromCharCode(65+i)}. ${option}
            </button>
            `;

        });

        html+=`
        <div id="result${num}" class="result"></div>

        </div>
        `;

        box.innerHTML+=html;

    });
}

function checkAnswer(num,selected,button){

    const item=questions[num-1];

    const parent=button.parentElement;

    const buttons=parent.querySelectorAll(".option");

    if(buttons[0].disabled){
        return;
    }

    buttons.forEach(btn=>{
        btn.disabled=true;
    });

    const result=document.getElementById("result"+num);

    answered++;

    if(selected===item.a){

        score++;

        result.className="result right";

        result.innerHTML=`
        <strong>✅ RIGHT!</strong>

        <div class="explanation">

        <b>Explanation:</b><br>

        ${item.e}

        </div>
        `;

    }

    else{

        const correct=
        String.fromCharCode(65+item.a);

        result.className="result wrong";

        result.innerHTML=`

        <strong>❌ WRONG!</strong>

        <br><br>

        <b>
        Correct Answer:
        ${correct}. ${item.o[item.a]}
        </b>

        <div class="explanation">

        <b>Explanation:</b><br>

        ${item.e}

        </div>
        `;

    }

    document.getElementById("score").innerHTML=
    `Score: ${score} / 60`;

    if(answered===questions.length){

        const percentage=
        (score/questions.length)*100;

        const finish=
        document.getElementById("finish");

        finish.style.display="block";

        let message="";

        if(percentage>=90){
            message="🏆 Excellent! Entrance Exam Level!";
        }
        else if(percentage>=75){
            message="🔥 Very Good! Keep practicing!";
        }
        else if(percentage>=50){
            message="👍 Good! Review your weak topics.";
        }
        else{
            message="📚 Keep studying and try again.";
        }

        finish.innerHTML=`

        🎉 <b>UNIT 2 COMPLETED!</b>

        <br><br>

        Score:
        ${score} / ${questions.length}

        <br>

        Percentage:
        ${percentage.toFixed(1)}%

        <br><br>

        ${message}

        `;

    }

}

showQuestions();

</script>

</body>
</html>
