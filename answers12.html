<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 12 Math Answers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .answer {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        .correct {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🏆 Grade 12 Mathematics Answers</h1>
    <p>Calculus</p>
</header>

<div class="answer">
    <h3>1. Find the derivative of x².</h3>
    <p class="correct">✅ Answer: 2x</p>
</div>

<div class="answer">
    <h3>2. Find the derivative of x³.</h3>
    <p class="correct">✅ Answer: 3x²</p>
</div>

<div class="answer">
    <h3>3. Find the derivative of 5x².</h3>
    <p class="correct">✅ Answer: 10x</p>
</div>

<div class="answer">
    <h3>4. Find the derivative of 3x² + 2x.</h3>
    <p class="correct">✅ Answer: 6x + 2</p>
</div>

<div class="answer">
    <h3>5. Find the derivative of x⁴.</h3>
    <p class="correct">✅ Answer: 4x³</p>
</div>

</body>
</html>
