<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9 Chemistry Unit 2 Practice</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{margin:0}
.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    box-shadow:0 3px 12px #ccc;
}

.number{
    color:#7c3aed;
    font-weight:bold;
}

.progress{
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0 25px;
}

.bar{
    height:100%;
    width:0;
    background:#7c3aed;
    transition:.3s;
}

.question{
    font-size:20px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

.option{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:2px solid #ddd;
    border-radius:10px;
    background:white;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#f3e8ff;
}

.correct{
    background:#dcfce7 !important;
    border-color:#16a34a !important;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#dc2626 !important;
}

.feedback{
    display:none;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    line-height:1.6;
}

.feedback.correctBox{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.feedback.wrongBox{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.next,.restart,.back{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

.next{
    background:#2563eb;
    display:none;
}

.restart{
    background:#16a34a;
}

.back{
    background:#172554;
}

#result{
    display:none;
    text-align:center;
}

.score{
    font-size:42px;
    color:#7c3aed;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🧪 Grade 9 Chemistry</h1>
<p>Unit 2 — Measurement and Scientific Method</p>
<p>📝 60 Questions</p>
</header>

<div class="container">

<div class="card" id="quiz">

<div class="number" id="number">
Question 1 of 60
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="question" id="question"></div>

<div id="options"></div>

<div id="feedback" class="feedback"></div>

<button class="next" id="next" onclick="nextQuestion()">
➡️ Next Question
</button>

</div>


<div class="card" id="result">

<h2>🎉 Practice Complete!</h2>

<p>Your Score</p>

<div class="score" id="score"></div>

<p id="message"></p>

<button class="restart" onclick="restartQuiz()">
🔄 Try Again
</button>

<button class="back" onclick="location.href='grade9.html'">
← Back to Grade 9
</button>

</div>

</div>


<script>

const questions=[

{

q:"1 metre is equal to:",

o:["0.5 L","5 L","50 L","0.05 L"],

{
q:"What does SI stand for?",
o:[
"International System of Units",

"Standard Investigation",

e:"SI stands for International System of Units."

{
q:"Which prefix means one thousandth?",

o:["2","4","5","1"],

o:[

q:"3000 in scientific notation is:",
o:["3 × 10³","30 × 10²","300 × 10","3 × 10⁻³"],

a:0,

a:0,

q:"What is the dependent variable?",
o:[
"The variable measured or observed",
"The variable deliberately changed",

"The hypothesis"

a:0,

q:"What are controlled variables?",
o:[

a:0,

{
q:"In an experiment testing temperature effect on dissolving sugar, temperature is the:",
o:["Independent variable","Dependent variable","Controlled variable","Conclusion"],
a:0,
e:"Temperature is deliberately changed, so it is the independent variable."
},

{
q:"In the same experiment, dissolving time is the:",
o:["Dependent variable","Independent variable","Control","Hypothesis"],
a:0,
e:"Dissolving time is measured, so it is the dependent variable."
},

{
q:"Which is qualitative data?",
o:[
"The solution is blue",
"The temperature is 25°C",

a:0,

let current=0;
let score=0;
let answered=false;

function loadQuestion(){

answered=false;

let q=questions[current];

document.getElementById("number").innerText=
"Question "+(current+1)+" of "+questions.length;

document.getElementById("question").innerText=q.q;

document.getElementById("bar").style.width=
((current+1)/questions.length*100)+"%";

let options=document.getElementById("options");
options.innerHTML="";

q.o.forEach((text,index)=>{

let btn=document.createElement("button");

btn.className="option";

btn.innerText=
String.fromCharCode(65+index)+". "+text;

btn.onclick=()=>checkAnswer(index,btn);

options.appendChild(btn);

});

document.getElementById("feedback").className="feedback";
document.getElementById("feedback").innerHTML="";

document.getElementById("next").style.display="none";
}


function checkAnswer(selected,button){

if(answered)return;

answered=true;

let q=questions[current];

let buttons=document.querySelectorAll(".option");

buttons.forEach((b,i)=>{
b.disabled=true;

if(i===q.a){
b.classList.add("correct");
}
});

let feedback=document.getElementById("feedback");

if(selected===q.a){

score++;

button.classList.add("correct");

feedback.className="feedback correctBox";

feedback.innerHTML=
"✅ <strong>Correct!</strong><br>"+
"Excellent! Your answer is correct.";

}else{

button.classList.add("wrong");

feedback.className="feedback wrongBox";

feedback.innerHTML=
"❌ <strong>Wrong!</strong><br>"+
"💡 <strong>Explain:</strong> "+q.e;

}

document.getElementById("next").style.display="block";
}


function nextQuestion(){

current++;

if(current<questions.length){

loadQuestion();

window.scrollTo({
top:0,
behavior:"smooth"
});

}else{

showResult();

}
}


function showResult(){

document.getElementById("quiz").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("score").innerText=
score+" / "+questions.length;

let percent=(score/questions.length)*100;

if(percent>=80){

document.getElementById("message").innerText=
"🏆 Excellent! You have a strong understanding of Unit 2.";

}else if(percent>=60){

document.getElementById("message").innerText=
"👍 Good job! Review the questions you missed.";

}else{

document.getElementById("message").innerText=
"📚 Keep studying Unit 2 Notes and try again.";

}
}


function restartQuiz(){

current=0;
score=0;

document.getElementById("quiz").style.display="block";

document.getElementById("result").style.display="none";

loadQuestion();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

loadQuestion();

</script>

</body>
</html>
