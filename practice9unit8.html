<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade 9 Mathematics - Unit 8 Practice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

#score{
    background:white;
    padding:18px;
    margin:15px 0;
    border-radius:14px;
    box-shadow:0 3px 10px #ccc;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.question{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 10px #ccc;
}

.question h3{
    line-height:1.6;
}

.option{
    display:block;
    width:100%;
    padding:14px;
    margin:9px 0;
    border:2px solid #ddd;
    border-radius:10px;
    background:white;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#eef4ff;
}

.option:disabled{
    cursor:not-allowed;
    opacity:.7;
}

.result{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    line-height:1.7;
}

.right{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.wrong{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.explanation{
    margin-top:10px;
    padding:12px;
    background:#eef4ff;
    color:#222;
    border-radius:8px;
}

#finish{
    display:none;
    background:#2563eb;
    color:white;
    padding:25px;
    border-radius:14px;
    text-align:center;
    font-size:21px;
    margin:25px 0;
}

.back{
    display:block;
    background:#172554;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:10px;
    margin:25px 0;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>➡️ Grade 9 Mathematics</h1>
<p>Unit 8 — Vectors in Two Dimensions</p>
<p>🔥 60 Practice Questions</p>
</header>

<div class="container">

<div id="score">
Score: 0 / 60
</div>

<div id="questions"></div>

<div id="finish"></div>

<a href="grade9grade.html" class="back">
← Back to Grade 9 Mathematics
</a>

</div>

<script>

const questions = [

{
q:"Which of the following is a scalar quantity?",
o:["Force","Velocity","Mass","Displacement"],
a:2,
e:"Mass has magnitude only, so it is a scalar quantity."
},

{
q:"Which of the following is a vector quantity?",
o:["Time","Temperature","Mass","Force"],
a:3,
e:"Force has both magnitude and direction, so it is a vector."
},

{
q:"A scalar quantity has:",
o:["Magnitude only","Direction only","Magnitude and direction","No magnitude"],
a:0,
e:"A scalar quantity is completely described by its magnitude."
},

{
q:"A vector quantity has:",
o:["Magnitude only","Direction only","Magnitude and direction","Neither magnitude nor direction"],
a:2,
e:"A vector has both magnitude and direction."
},

{
q:"Which one is NOT a vector quantity?",
o:["Velocity","Acceleration","Distance","Force"],
a:2,
e:"Distance has magnitude only, so it is a scalar."
},

{
q:"Which one is a vector quantity?",
o:["Speed","Time","Temperature","Displacement"],
a:3,
e:"Displacement has magnitude and direction."
},

{
q:"A vector is commonly represented by:",
o:["A circle","A directed line segment","A number only","A table"],
a:1,
e:"A vector is commonly represented by a directed line segment with an arrow."
},

{
q:"In vector AB, A is called the:",
o:["Terminal point","Initial point","Middle point","Origin always"],
a:1,
e:"A is the starting or initial point and B is the terminal point."
},

{
q:"In vector AB, B is called the:",
o:["Initial point","Terminal point","Origin","Scalar"],
a:1,
e:"B is the endpoint or terminal point of vector AB."
},

{
q:"Two vectors are equal when they have:",
o:["Same direction only","Same magnitude only","Same magnitude and direction","Different magnitude"],
a:2,
e:"Equal vectors have the same magnitude and the same direction."
},

{
q:"Two opposite vectors have:",
o:["Different magnitude and same direction","Same magnitude and opposite directions","Same direction only","Zero magnitude"],
a:1,
e:"Opposite vectors have equal magnitude but point in opposite directions."
},

{
q:"If a = 5 m east, then −a is:",
o:["5 m east","5 m west","10 m east","0 m"],
a:1,
e:"The negative of a vector reverses its direction while keeping the same magnitude."
},

{
q:"If a vector is 7 units north, its opposite is:",
o:["7 units north","14 units north","7 units south","0 units"],
a:2,
e:"The opposite vector has the same magnitude but the opposite direction."
},

{
q:"Parallel vectors lie along:",
o:["Parallel lines","Perpendicular lines only","The same point only","Circles"],
a:0,
e:"Parallel vectors have directions along parallel lines, either the same or opposite."
},

{
q:"Which symbol represents that vectors a and b are parallel?",
o:["a + b","a = b","a ∥ b","a − b"],
a:2,
e:"The symbol ∥ means parallel."
},

{
q:"A vector in two dimensions can be written as:",
o:["A single number only","A column vector","A temperature","A scalar"],
a:1,
e:"Two-dimensional vectors can be represented using column vectors."
},

{
q:"In the column vector [3; 4], the horizontal component is:",
o:["3","4","7","12"],
a:0,
e:"The first component represents the horizontal or x-component."
},

{
q:"In the column vector [3; 4], the vertical component is:",
o:["3","4","7","12"],
a:1,
e:"The second component represents the vertical or y-component."
},

{
q:"What is the magnitude of [3; 4]?",
o:["3","4","5","7"],
a:2,
e:"Magnitude = √(3² + 4²) = √25 = 5."
},

{
q:"What is the magnitude of [5; 12]?",
o:["10","12","13","17"],
a:2,
e:"Magnitude = √(5² + 12²) = √169 = 13."
},

{
q:"What is the magnitude of [6; 8]?",
o:["8","10","12","14"],
a:1,
e:"Magnitude = √(6² + 8²) = √100 = 10."
},

{
q:"The formula for the magnitude of [x; y] is:",
o:["x + y","x − y","√(x² + y²)","xy"],
a:2,
e:"The magnitude is √(x² + y²)."
},

{
q:"The magnitude of [0; 5] is:",
o:["0","1","5","25"],
a:2,
e:"√(0² + 5²) = 5."
},

{
q:"The magnitude of [8; 0] is:",
o:["0","4","8","64"],
a:2,
e:"√(8² + 0²) = 8."
},

{
q:"If a vector is [3; 4], tan θ equals:",
o:["3/4","4/3","7/3","3/7"],
a:1,
e:"tan θ = y/x = 4/3."
},

{
q:"If x = 3 and y = 4, the direction angle is approximately:",
o:["30°","45°","53.1°","90°"],
a:2,
e:"θ = tan⁻¹(4/3) ≈ 53.1°."
},

{
q:"If a = [2; 3] and b = [4; 5], find a + b.",
o:["[6; 8]","[2; 2]","[8; 6]","[4; 8]"],
a:0,
e:"Add corresponding components: [2+4; 3+5] = [6; 8]."
},

{
q:"If a = [5; 2] and b = [3; 4], find a + b.",
o:["[8; 6]","[2; −2]","[15; 8]","[5; 6]"],
a:0,
e:"[5+3; 2+4] = [8; 6]."
},

{
q:"If a = [7; 4] and b = [2; 1], find a − b.",
o:["[9; 5]","[5; 3]","[5; 5]","[14; 4]"],
a:1,
e:"[7−2; 4−1] = [5; 3]."
},

{
q:"If a = [6; 8] and b = [2; 3], find a − b.",
o:["[4; 5]","[8; 11]","[12; 24]","[4; 11]"],
a:0,
e:"[6−2; 8−3] = [4; 5]."
},

{
q:"Vector subtraction can be written as:",
o:["a − b = a + b","a − b = a + (−b)","a − b = b + a","a − b = 0"],
a:1,
e:"Subtracting b is the same as adding the opposite vector −b."
},

{
q:"If a = [1; 2] and b = [3; 4], what is a + b?",
o:["[4; 6]","[2; 2]","[3; 8]","[1; 6]"],
a:0,
e:"Add the corresponding components: [1+3; 2+4] = [4; 6]."
},

{
q:"If a = [9; 7] and b = [4; 2], what is a − b?",
o:["[13; 9]","[5; 5]","[36; 14]","[4; 5]"],
a:1,
e:"[9−4; 7−2] = [5; 5]."
},

{
q:"What is 3[2; 4]?",
o:["[5; 7]","[6; 12]","[2; 12]","[6; 4]"],
a:1,
e:"Multiply every component by 3: [3×2; 3×4] = [6; 12]."
},

{
q:"What is 5[1; 3]?",
o:["[5; 15]","[6; 8]","[1; 15]","[5; 3]"],
a:0,
e:"5[1;3] = [5×1; 5×3] = [5;15]."
},

{
q:"What is −2[3; 4]?",
o:["[6; 8]","[−6; −8]","[−3; −4]","[2; 8]"],
a:1,
e:"Multiply both components by −2: [−6; −8]."
},

{
q:"Multiplication of a vector by a positive scalar:",
o:["Reverses its direction","Keeps its direction","Makes it zero always","Changes only its direction"],
a:1,
e:"A positive scalar changes the magnitude but keeps the direction."
},

{
q:"Multiplication of a vector by a negative scalar:",
o:["Keeps exactly the same direction","Reverses the direction","Makes the vector undefined","Removes its magnitude"],
a:1,
e:"A negative scalar reverses the vector's direction."
},

{
q:"The triangle law of vector addition involves placing vectors:",
o:["Head-to-tail","At right angles only","On a circle","At the origin only"],
a:0,
e:"In the triangle law, the second vector is placed head-to-tail with the first."
},

{
q:"In the triangle law, the resultant vector connects:",
o:["Final point to initial point only","Initial point to final point","Two middle points","Two origins"],
a:1,
e:"The resultant goes from the starting point to the final point."
},

{
q:"The parallelogram law is used when two vectors:",
o:["Start from the same point","Have zero magnitude","Are scalars","Are always perpendicular"],
a:0,
e:"The parallelogram law starts both vectors from the same point."
},

{
q:"In the parallelogram law, the resultant is represented by the:",
o:["Side of the parallelogram","Diagonal","Perimeter","Area"],
a:1,
e:"The diagonal from the common starting point represents the resultant."
},

{
q:"If a = [4; 6], then 2a is:",
o:["[6; 8]","[8; 12]","[4; 12]","[2; 3]"],
a:1,
e:"2[4;6] = [8;12]."
},

{
q:"If a = [8; 10], then 1/2 a is:",
o:["[4; 5]","[8; 5]","[16; 20]","[4; 10]"],
a:0,
e:"Half of each component gives [4;5]."
},

{
q:"The position vector of point P(3,5) is:",
o:["[5;3]","[3;5]","[3;−5]","[−3;5]"],
a:1,
e:"The position vector from the origin to P(3,5) is [3;5]."
},

{
q:"The position vector of point A(−2,4) is:",
o:["[2;4]","[−2;4]","[−2;−4]","[4;−2]"],
a:1,
e:"The coordinates directly form the position vector: [−2;4]."
},

{
q:"A position vector starts from:",
o:["Any terminal point","The origin","The x-axis only","The y-axis only"],
a:1,
e:"A position vector describes the position of a point relative to the origin."
},

{
q:"If the position vectors of A and B are a and b, then AB is:",
o:["a + b","a − b","b − a","ab"],
a:2,
e:"The vector from A to B is final position minus initial position: b − a."
},

{
q:"If A has position vector [2;3] and B has [7;8], find AB.",
o:["[9;11]","[5;5]","[−5;−5]","[14;24]"],
a:1,
e:"AB = B − A = [7−2; 8−3] = [5;5]."
},

{
q:"If A=[5;6] and B=[2;1], find AB.",
o:["[7;7]","[3;5]","[−3;−5]","[10;6]"],
a:2,
e:"AB = B − A = [2−5; 1−6] = [−3;−5]."
},

{
q:"The vector BA in the previous question is:",
o:["[−3;−5]","[3;5]","[7;7]","[2;1]"],
a:1,
e:"BA = A − B = [5−2; 6−1] = [3;5]."
},

{
q:"Which pair represents opposite vectors?",
o:["[2;3] and [2;3]","[2;3] and [−2;−3]","[2;3] and [3;2]","[2;3] and [0;3]"],
a:1,
e:"A vector and its negative have equal magnitude and opposite direction."
},

{
q:"If a=[3;−4], what is −a?",
o:["[3;4]","[−3;4]","[−3;−4]","[4;−3]"],
a:1,
e:"Change the sign of each component: −a=[−3;4]."
},

{
q:"If a=[−5;2] and b=[5;−2], then:",
o:["a=b","a=−b","a+b=a","a−b=0"],
a:1,
e:"b is the negative of a, so a=−b."
},

{
q:"Which vector has magnitude 10?",
o:["[6;8]","[5;5]","[8;8]","[3;4]"],
a:0,
e:"√(6²+8²)=√100=10."
},

{
q:"Which vector has magnitude 5?",
o:["[1;4]","[3;4]","[2;4]","[4;4]"],
a:1,
e:"√(3²+4²)=5."
},

{
q:"The magnitude of the zero vector [0;0] is:",
o:["0","1","2","Undefined"],
a:0,
e:"√(0²+0²)=0."
},

{
q:"If a=[3;4], which statement is correct?",
o:["|a|=3","|a|=4","|a|=5","|a|=7"],
a:2,
e:"The magnitude is √(9+16)=5."
},

{
q:"A vector with components [x;y] represents movement:",
o:["Only horizontally","Only vertically","Horizontally and vertically","Only in a circle"],
a:2,
e:"The x-component gives horizontal movement and y gives vertical movement."
},

{
q:"If a=[2;3] and b=[1;4], find a+b.",
o:["[3;7]","[1;1]","[2;12]","[3;1]"],
a:0,
e:"[2+1;3+4]=[3;7]."
},

{
q:"If a=[7;9] and b=[3;5], find a−b.",
o:["[10;14]","[4;4]","[21;45]","[4;14]"],
a:1,
e:"[7−3;9−5]=[4;4]."
},

{
q:"Which is an application of vectors?",
o:["Representing force","Measuring temperature only","Counting objects only","Writing words"],
a:0,
e:"Force has magnitude and direction, so vectors are used to represent it."
},

{
q:"Velocity is a vector because it has:",
o:["Magnitude only","Direction only","Speed and direction","Temperature"],
a:2,
e:"Velocity has both magnitude and direction."
},

{
q:"Displacement differs from distance because displacement has:",
o:["No magnitude","Direction","No units","Only time"],
a:1,
e:"Displacement is a vector and therefore includes direction."
},

{
q:"A force of 10 N east is a:",
o:["Scalar","Vector","Number without direction","Temperature"],
a:1,
e:"Force has magnitude (10 N) and direction (east), so it is a vector."
},

{
q:"If a=[2;5] and b=[3;−1], find a+b.",
o:["[5;4]","[−1;6]","[6;−5]","[5;6]"],
a:0,
e:"[2+3;5+(−1)] = [5;4]."
},

{
q:"If a=[8;3] and b=[2;7], find a−b.",
o:["[10;10]","[6;−4]","[6;4]","[16;21]"],
a:1,
e:"[8−2;3−7]=[6;−4]."
},

{
q:"If a=[1;2], what is 4a?",
o:["[4;8]","[5;6]","[1;8]","[4;2]"],
a:0,
e:"4[1;2]=[4;8]."
},

{
q:"If a=[4;−3], what is 2a?",
o:["[8;−6]","[8;6]","[6;−8]","[2;−1.5]"],
a:0,
e:"2[4;−3]=[8;−6]."
},

{
q:"If a=[4;−3], what is −a?",
o:["[4;3]","[−4;3]","[−4;−3]","[3;−4]"],
a:1,
e:"The negative vector changes both signs: [−4;3]."
}

];

let score = 0;
let answered = 0;

function showQuestions(){

    const box = document.getElementById("questions");

    questions.forEach((item,index)=>{

        const num = index + 1;

        let html = `
        <div class="question">

            <h3>${num}. ${item.q}</h3>
        `;

        item.o.forEach((option,i)=>{

            html += `
            <button
                class="option"
                onclick="checkAnswer(${num},${i},this)">

                ${String.fromCharCode(65+i)}. ${option}

            </button>
            `;

        });

        html += `

            <div id="result${num}" class="result"></div>

        </div>
        `;

        box.innerHTML += html;

    });

}

function checkAnswer(num,selected,button){

    if(button.disabled) return;

    const item = questions[num-1];

    const parent = button.parentElement;

    const buttons = parent.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    const result =
        document.getElementById("result"+num);

    answered++;

    if(selected === item.a){

        score++;

        result.className = "result right";

        result.innerHTML = `

            <strong>✅ RIGHT!</strong>

            <div class="explanation">

                <b>Explanation:</b><br>

                ${item.e}

            </div>

        `;

    }else{

        result.className = "result wrong";

        const correct =
            String.fromCharCode(65+item.a);

        result.innerHTML = `

            <strong>❌ WRONG!</strong>

            <br><br>

            <b>
            Correct Answer:
            ${correct}. ${item.o[item.a]}
            </b>

            <div class="explanation">

                <b>Explanation:</b><br>

                ${item.e}

            </div>

        `;

    }

    document.getElementById("score").innerHTML =
        `Score: ${score} / 60`;

    if(answered === questions.length){

        const percentage =
            (score / questions.length) * 100;

        const finish =
            document.getElementById("finish");

        finish.style.display = "block";

        finish.innerHTML = `

            🎉 <b>Practice Completed!</b>

            <br><br>

            Score: ${score} / 60

            <br>

            Percentage: ${percentage.toFixed(1)}%

            <br><br>

            ${
                percentage >= 80
                ? "🏆 Excellent Work!"
                : percentage >= 60
                ? "👍 Good Work! Keep Practicing."
                : "📚 Keep Studying and Try Again!"
            }

        `;

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    }

}

showQuestions();

</script>

</body>
</html>
