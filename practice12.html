<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 12 Math Practice</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .question {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 25px;
            margin: 20px 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        #score {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>📝 Grade 12 Math Practice</h1>
    <p>Calculus</p>
</header>

<div class="question">
    <h3>1. Find the derivative of x².</h3>
    <input id="q1" placeholder="Answer">
</div>

<div class="question">
    <h3>2. Find the derivative of x³.</h3>
    <input id="q2" placeholder="Answer">
</div>

<div class="question">
    <h3>3. Find the derivative of 5x².</h3>
    <input id="q3" placeholder="Answer">
</div>

<div class="question">
    <h3>4. Find the derivative of 3x² + 2x.</h3>
    <input id="q4" placeholder="Answer">
</div>

<div class="question">
    <h3>5. Find the derivative of x⁴.</h3>
    <input id="q5" placeholder="Answer">
</div>

<button onclick="calculateScore()">🎯 Submit Quiz</button>

<div id="score"></div>

<script>
function calculateScore() {

    let answers = [
        "2x",
        "3x^2",
        "10x",
        "6x+2",
        "4x^3"
    ];

    let score = 0;

    for (let i = 1; i <= 5; i++) {

        let userAnswer = document
            .getElementById("q" + i)
            .value
            .trim()
            .replace(/\s/g, "");

        if (userAnswer === answers[i - 1]) {
            score++;
        }
    }

    document.getElementById("score").innerHTML =
        "🎉 Your Score: " + score + "/5";
}
</script>

</body>
</html>
