<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chemistry Unit 4 Practice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#9333ea,#2563eb);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    margin:0;
    font-size:28px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:18px 0;
    border-radius:16px;
    box-shadow:0 3px 10px #ccc;
}

.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.option{
    width:100%;
    background:#eef2ff;
    color:#222;
    border:2px solid #ddd;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    font-size:16px;
}

.option:hover{
    background:#ddd6fe;
}

.option:disabled{
    cursor:not-allowed;
}

.correct{
    background:#dcfce7 !important;
    border-color:#16a34a !important;
    color:#166534 !important;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#dc2626 !important;
    color:#991b1b !important;
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    display:none;
}

.right{
    background:#dcfce7;
    color:#166534;
}

.wrongBox{
    background:#fee2e2;
    color:#991b1b;
}

.explanation{
    margin-top:10px;
    background:#f3f4f6;
    padding:12px;
    border-radius:8px;
    color:#374151;
}

#scoreBox{
    display:none;
    text-align:center;
    background:white;
    padding:25px;
    margin:20px 0;
    border-radius:16px;
    box-shadow:0 3px 10px #ccc;
}

#score{
    font-size:32px;
    font-weight:bold;
    color:#9333ea;
}

.retry{
    background:#9333ea;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    width:100%;
    background:#172554;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
    <h1>🧪 Chemistry — Unit 4</h1>
    <p>Periodic Classification of Elements</p>
    <p>📝 60 Multiple Choice Questions</p>
</header>

<div class="container">

<div id="quiz"></div>

<div id="scoreBox">
    <h2>🎉 Practice Completed!</h2>
    <p>Your Score:</p>
    <div id="score"></div>
    <p id="message"></p>

    <button class="retry" onclick="location.reload()">
        🔄 Try Again
    </button>
</div>

<button class="back" onclick="history.back()">
    ← Back
</button>

</div>

<script>

const questions = [

{
q:"1. Who proposed the law of triads?",
a:["Döbereiner","Newlands","Mendeleev","Moseley"],
c:0,
e:"Johann Döbereiner grouped some elements into groups of three called triads."

{
q:"2. What is a Döbereiner triad?",
a:["A group of two elements","A group of three chemically similar elements","A group of four elements","A group of eight elements"],
c:1,
e:"A Döbereiner triad contains three elements with similar chemical properties."
},

{
q:"3. In a Döbereiner triad, the atomic mass of the middle element is approximately:",
a:["Double the first","The average of the first and third","Equal to the third","Zero"],
c:1,
e:"The atomic mass of the middle element was approximately the average of the other two."
},

{
q:"4. Who proposed the Law of Octaves?",
a:["Mendeleev","Moseley","Newlands","Dalton"],

e:"John Newlands proposed the Law of Octaves."

{
q:"5. Newlands arranged elements according to increasing:",

{
q:"6. Newlands noticed that every eighth element had similar:",
a:["Color only","Chemical properties","Mass only","Size"],

e:"Newlands observed that every eighth element had properties similar to the first."

{
q:"7. The Law of Octaves was compared with:",
a:["Musical octaves","Chemical bonds","Electricity","Light"],

e:"Newlands compared the repeating pattern of elements to musical octaves."

{
q:"8. Who developed the first widely accepted periodic table?",
a:["Mendeleev","Newlands","Döbereiner","Rutherford"],
c:0,

},

{
q:"9. Mendeleev mainly arranged elements according to increasing:",

c:1,
e:"Mendeleev arranged elements mainly according to increasing atomic mass."
},

{
q:"10. Mendeleev left gaps in his table because:",
a:["He forgot elements","He predicted undiscovered elements","There were no metals","He disliked gases"],
c:1,
e:"Mendeleev left gaps for elements that had not yet been discovered."
},

{
q:"11. One important success of Mendeleev's table was:",
a:["Predicting new elements","Removing all gases","Discovering electrons","Creating atoms"],
c:0,
e:"Mendeleev successfully predicted the properties of several undiscovered elements."
},

{
q:"12. Mendeleev's periodic law states that properties of elements are periodic functions of:",
a:["Atomic mass","Atomic volume only","Density","Temperature"],
c:0,
e:"Mendeleev's original periodic law related properties to atomic mass."
},

{
q:"13. The modern periodic law is based on:",
a:["Atomic mass","Atomic number","Density","Melting point"],
c:1,
e:"The modern periodic law states that properties of elements are periodic functions of atomic number."
},

{
q:"14. Who established atomic number as the basis of periodic classification?",
a:["Moseley","Newlands","Mendeleev","Bohr"],
c:0,
e:"Henry Moseley showed that atomic number is fundamental to periodic classification."
},

{
q:"15. The modern periodic table contains how many periods?",
a:["5","6","7","8"],
c:2,

},

{
q:"16. The modern periodic table contains how many groups?",
a:["8","12","18","20"],

{

q:"18. A horizontal row in the periodic table is called a:",

a:["Chemical properties","Atomic masses","Number of shells","Physical state"],

},

q:"20. The s-block contains mainly:",
a:["Groups 1 and 2","Groups 3 and 4","Groups 13–18","Only transition metals"],

q:"22. The d-block elements are commonly called:",
a:["Noble gases","Transition elements","Halogens","Alkali metals"],

e:"The d-block contains the transition elements."

{
q:"24. Which block is located in the middle of the periodic table?",
a:["s-block","p-block","d-block","f-block"],

q:"33. Across a period, atomic number generally:",

q:"35. Atomic radius generally increases down a group because:",

a:["Down a group","Across a period","Randomly","Only in metals"],

q:"38. First ionization energy generally decreases:",
a:["Across a period","Down a group","Toward fluorine","Toward the right"],
c:1,
e:"Ionization energy generally decreases down a group because outer electrons are farther from the nucleus."

q:"39. Which generally has the highest ionization energy?",
a:["Alkali metals","Noble gases","Alkaline earth metals","Transition metals"],
c:1,
e:"Noble gases generally have very high ionization energies because their electron shells are stable."
},

q:"40. Electron affinity describes the energy change when an atom:",
a:["Gains an electron","Loses a proton","Gains a neutron","Melts"],
c:0,
e:"Electron affinity concerns the energy change associated with gaining an electron."
},

q:"41. Which group generally has a strong tendency to gain electrons?",
a:["Halogens","Alkali metals","Noble gases","Alkaline earth metals"],

c:1,
e:"Electronegativity generally increases from left to right across a period."

a:["Across a period","Down a group","Toward fluorine","Toward the upper right"],
c:1,
e:"Electronegativity generally decreases down a group."
},

{
q:"45. The most electronegative element is:",
a:["Oxygen","Chlorine","Fluorine","Sodium"],
c:2,
e:"Fluorine has the highest electronegativity."
},

{
q:"46. Metals are generally located on the:",
a:["Left side of the periodic table","Right side only","Top right only","Middle bottom only"],
c:0,
e:"Most metals are found on the left and center of the periodic table."
},

{
q:"47. Nonmetals are mainly found on the:",
a:["Left side","Right side","Bottom only","Center only"],
c:1,
e:"Most nonmetals are located on the right side of the periodic table."
},

{
q:"48. Metalloids are generally found:",
a:["Along the staircase line","Only in Group 1","Only in Group 18","At the bottom"],
c:0,
e:"Metalloids are generally located along the staircase boundary between metals and nonmetals."
},

{
q:"49. Which is a metalloid?",

e:"Representative elements are mainly the s- and p-block elements."
},

q:"51. Which element belongs to the d-block?",
a:["Fe","Na","Cl","Ne"],

e:"Iron (Fe) is a transition element in the d-block."

e:"Uranium (U) belongs to the actinide series of the f-block."

a:["Li","Na","K","Rb"],
c:3,
e:"Atomic radius increases down Group 1, so Rb is largest among these."
},

{
q:"54. Which has the smallest atomic radius?",
a:["Li","Na","K","Rb"],
c:0,
e:"Atomic radius decreases upward in a group, so Li is the smallest."
},

{

a:["Na","Mg","Cl","F"],

e:"Fluorine is the most electronegative element."
},

q:"56. Which generally has the lowest ionization energy?",
a:["Li","Na","K","Rb"],
c:3,
e:"Ionization energy decreases down Group 1, making Rb the lowest among these."
},

{
q:"57. The periodic table is useful because it:",
a:["Organizes elements according to their properties","Removes atoms","Changes elements into compounds","Measures temperature"],
c:0,
e:"The periodic table organizes elements so their properties and trends can be studied easily."
},

{
q:"58. Which property generally increases from left to right across a period?",
a:["Atomic radius","Electronegativity","Metallic character","Number of shells"],
c:1,
e:"Electronegativity generally increases from left to right across a period."
},

{
q:"59. Metallic character generally increases:",
a:["From left to right","Up a group","Down a group","Toward the upper right"],
c:2,
e:"Metallic character increases down a group because atoms more easily lose outer electrons."
},

{
q:"60. Which statement is correct?",
a:["Atomic radius generally increases across a period",
   "Ionization energy generally decreases across a period",
   "Electronegativity generally increases across a period",
   "All elements have the same properties"],
c:2,
e:"Electronegativity generally increases from left to right across a period."
}

];

let score=0;
let answered=0;

function loadQuiz(){

    const quiz=document.getElementById("quiz");

    questions.forEach((item,index)=>{

        const card=document.createElement("div");
        card.className="card";

        const question=document.createElement("div");
        question.className="question";
        question.textContent=item.q;

        card.appendChild(question);

        item.a.forEach((answer,optionIndex)=>{

            const button=document.createElement("button");

            button.className="option";
            button.textContent=
                String.fromCharCode(65+optionIndex)+". "+answer;

            button.onclick=function(){

                checkAnswer(
                    button,
                    card,
                    optionIndex,
                    item.c,
                    item.e
                );

            };

            card.appendChild(button);

        });

        const result=document.createElement("div");
        result.className="result";

        card.appendChild(result);

        quiz.appendChild(card);

    });

}

function checkAnswer(
    selected,
    card,
    selectedIndex,
    correctIndex,
    explanation
){

    const buttons=card.querySelectorAll(".option");
    const result=card.querySelector(".result");

    buttons.forEach(button=>{
        button.disabled=true;
    });

    answered++;

    if(selectedIndex===correctIndex){

        score++;

        selected.classList.add("correct");

        result.className="result right";
        result.style.display="block";

        result.innerHTML=
            "<strong>✅ RIGHT / CORRECT!</strong>"+
            "<div class='explanation'>"+
            "📖 <strong>Explanation:</strong> "+
            explanation+
            "</div>";

    }else{

        selected.classList.add("wrong");

        buttons[correctIndex].classList.add("correct");

        result.className="result wrongBox";
        result.style.display="block";

        result.innerHTML=
            "<strong>❌ WRONG!</strong>"+
            "<div class='explanation'>"+
            "📖 <strong>Explanation:</strong> "+
            explanation+
            "</div>";

    }

    if(answered===questions.length){

        showScore();

    }

}

function showScore(){

    const scoreBox=document.getElementById("scoreBox");

    scoreBox.style.display="block";

    document.getElementById("score").textContent=
        score+" / "+questions.length;

    let message="";

    const percent=(score/questions.length)*100;

    if(percent>=90){
        message="🏆 Excellent! You really understand Unit 4.";
    }else if(percent>=75){
        message="👏 Very good! Keep practicing.";
    }else if(percent>=50){
        message="👍 Good effort. Review the notes and try again.";
    }else{
        message="📚 Keep studying and try again. You can improve!";
    }

    document.getElementById("message").textContent=message;

    scoreBox.scrollIntoView({
        behavior:"smooth"
    });

}

loadQuiz();

</script>

</body>
</html>
