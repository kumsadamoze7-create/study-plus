let score=0;
let answered=0;

const quiz=document.getElementById("quiz");

questions.forEach((item,index)=>{

    const card=document.createElement("div");

    card.className="card question";

    card.innerHTML=`
        <h3>Question ${index+1} / ${questions.length}</h3>
        <p><strong>${item.q}</strong></p>
        <div id="options${index}"></div>
        <div id="result${index}" class="result"></div>
    `;

    quiz.appendChild(card);

    const box=document.getElementById("options"+index);

    item.o.forEach((option,i)=>{

        const btn=document.createElement("button");

        btn.className="option";

        btn.innerText=
        String.fromCharCode(65+i)+". "+option;

        btn.onclick=()=>{
            checkAnswer(index,i,btn,box);
        };

        box.appendChild(btn);

    });

});


function checkAnswer(index,selected,button,box){

    const result=document.getElementById("result"+index);

    if(result.dataset.done==="true"){
        return;
    }

    result.dataset.done="true";

    answered++;

    const correct=questions[index].a;

    const buttons=box.querySelectorAll(".option");

    buttons.forEach((btn,i)=>{

        btn.disabled=true;

        if(i===correct){
            btn.classList.add("correct");
        }

    });


    if(selected===correct){

        score++;

        result.className="result right";

        result.innerHTML=`
        <strong>✅ RIGHT!</strong>
        <div class="explanation">
        <strong>Explanation:</strong><br>
        ${questions[index].e}
        </div>
        `;

    }else{

        button.classList.add("wrong");

        result.className="result wrongResult";

        result.innerHTML=`
        <strong>❌ WRONG!</strong>
        <div class="explanation">
        <strong>Correct Answer:</strong>
        ${questions[index].o[correct]}
        <br><br>
        <strong>Explanation:</strong><br>
        ${questions[index].e}
        </div>
        `;

    }

    result.style.display="block";

    updateProgress();

    if(answered===questions.length){
        showFinal();
    }

}


function updateProgress(){

    document.getElementById("progress").innerText=
    "Answered: "+answered+
    " / "+questions.length+
    " | Score: "+score;

}


function showFinal(){

    const percent=
    Math.round((score/questions.length)*100);

    document.getElementById("finalScore").innerText=
    score+" / "+questions.length;

    let message;

    if(percent>=90){

        message="🏆 Excellent! You mastered Unit 4.";

    }else if(percent>=75){

        message="👏 Very Good! Review the questions you missed.";

    }else if(percent>=50){

        message="👍 Good effort! Read Unit 4 again and practice.";

    }else{

        message="📖 Keep studying! Review the notes and try again.";

    }

    document.getElementById("message").innerText=
    percent+"% — "+message;

}
