<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 9 Math Quiz - Study Plus</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .quiz {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 25px;
            margin: 20px 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        #score {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>📝 Grade 9 Math Quiz</h1>
    <p>Study Plus</p>
</header>

<div class="quiz">
    <h3>1. What is 1/2 + 1/4?</h3>
    <input id="q1" placeholder="Answer">
</div>

<div class="quiz">
    <h3>2. What is 3 × 4?</h3>
    <input id="q2" placeholder="Answer">
</div>

<div class="quiz">
    <h3>3. What is 10 - 6?</h3>
    <input id="q3" placeholder="Answer">
</div>

<div class="quiz">
    <h3>4. What is 5 + 7?</h3>
    <input id="q4" placeholder="Answer">
</div>

<div class="quiz">
    <h3>5. What is 20 ÷ 4?</h3>
    <input id="q5" placeholder="Answer">
</div>

<div class="quiz">
    <h3>6. What is 2²?</h3>
    <input id="q6" placeholder="Answer">
</div>

<div class="quiz">
    <h3>7. What is 15 - 9?</h3>
    <input id="q7" placeholder="Answer">
</div>

<div class="quiz">
    <h3>8. What is 6 × 5?</h3>
    <input id="q8" placeholder="Answer">
</div>

<div class="quiz">
    <h3>9. What is 18 ÷ 3?</h3>
    <input id="q9" placeholder="Answer">
</div>

<div class="quiz">
    <h3>10. What is 9 + 8?</h3>
    <input id="q10" placeholder="Answer">
</div>

<button onclick="calculateScore()">🎯 Submit Quiz</button>

<div id="score"></div>

<script>
function calculateScore() {

    let answers = [
        "3/4",
        "12",
        "4",
        "12",
        "5",
        "4",
        "6",
        "30",
        "6",
        "17"
    ];

    let score = 0;

    for (let i = 1; i <= 10; i++) {

        let userAnswer = document
            .getElementById("q" + i)
            .value
            .trim();

        if (userAnswer === answers[i - 1]) {
            score++;
        }
    }

    document.getElementById("score").innerHTML =
        "🎉 Your Score: " + score + "/10";
}
</script>

</body>
</html>
