questions.forEach((item,i)=>{

 card.dataset.done="1"; answered++;

 const result=card.querySelector(".result");

   score++;
   result.className="result right";
   result.textContent="✅ RIGHT! Correct answer: "+item.answer;

   result.className="result wrong";
