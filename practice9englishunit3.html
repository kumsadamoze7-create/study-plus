"The hardest you study, the best you become.",
"The more hard you study, the more good you become."
],
c:1,
e:"The correct correlative comparative structure is 'The harder you study, the better you become.' Both 'harder' and 'better' are already comparative forms."
}

];


let score=0;
let answered=0;

function loadQuiz(){

const quiz=document.getElementById("quiz");

questions.forEach((item,index)=>{

const card=document.createElement("div");

card.className="card question";

let html=`<h3>${item.q}</h3>`;

item.a.forEach((option,i)=>{

html+=`
<button
class="option"
onclick="checkAnswer(${index},${i},this)">
${String.fromCharCode(65+i)}. ${option}
</button>
`;

});

html+=`
<div id="exp${index}" class="explanation">
<strong>Explanation:</strong><br>
${item.e}
</div>

<div id="res${index}" class="result"></div>
`;

card.innerHTML=html;

quiz.appendChild(card);

});

}

function checkAnswer(qIndex,selected,button){

const card=button.closest(".question");

const buttons=card.querySelectorAll(".option");

const result=document.getElementById("res"+qIndex);

const explanation=document.getElementById("exp"+qIndex);

if(card.dataset.answered==="true"){
return;
}

card.dataset.answered="true";

answered++;

document.getElementById("answered").textContent=answered;

buttons.forEach((btn,i)=>{

btn.disabled=true;

if(i===questions[qIndex].c){
btn.classList.add("correct");
}

});

if(selected===questions[qIndex].c){

score++;

document.getElementById("score").textContent=score;

result.innerHTML="✅ RIGHT!";

result.style.color="#16a34a";

}else{

button.classList.add("wrong");

result.innerHTML="❌ WRONG!";

result.style.color="#dc2626";

}

explanation.style.display="block";

}

loadQuiz();

</script>
