<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade 11 Math Answers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .answer {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        .correct {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🏆 Grade 11 Mathematics Answers</h1>
    <p>Functions</p>
</header>

<div class="answer">
    <h3>1. If f(x) = 2x + 3, find f(2).</h3>
    <p class="correct">✅ Answer: 7</p>
</div>

<div class="answer">
    <h3>2. If f(x) = x² + 1, find f(5).</h3>
    <p class="correct">✅ Answer: 26</p>
</div>

<div class="answer">
    <h3>3. If f(x) = 3x, find f(4).</h3>
    <p class="correct">✅ Answer: 12</p>
</div>

<div class="answer">
    <h3>4. If f(x) = x + 7, find f(3).</h3>
    <p class="correct">✅ Answer: 10</p>
</div>

<div class="answer">
    <h3>5. If f(x) = 5x - 2, find f(2).</h3>
    <p class="correct">✅ Answer: 8</p>
</div>

</body>
</html>
