let score = 0;
let answered = 0;

function loadQuiz(){

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    questions.forEach((item,index)=>{

        const card = document.createElement("div");
        card.className = "question-card";

        card.innerHTML = `
            <div class="question-number">
                Question ${index+1} of ${questions.length}
            </div>

            <div class="question">
                ${item.q}
            </div>

            <div id="options-${index}"></div>

            <div id="feedback-${index}" class="feedback"></div>
        `;

        quiz.appendChild(card);

        const optionsDiv = document.getElementById(`options-${index}`);

        item.options.forEach((option,optionIndex)=>{

            const button = document.createElement("button");

            button.className = "option";
            button.innerHTML =
                `<strong>${String.fromCharCode(65+optionIndex)}.</strong> ${option}`;

            button.onclick = function(){
                checkAnswer(index,optionIndex,button);
            };

            optionsDiv.appendChild(button);

        });

    });
}

function checkAnswer(questionIndex,selected,selectedButton){

    const question = questions[questionIndex];

    const options =
        document.querySelectorAll(`#options-${questionIndex} .option`);

    options.forEach(btn=>{
        btn.disabled = true;
    });

    const feedback =
        document.getElementById(`feedback-${questionIndex}`);

    answered++;

    if(selected === question.answer){

        score++;

        selectedButton.classList.add("correct");

        feedback.className = "feedback correct";

        feedback.innerHTML = `
            <strong>✅ CORRECT!</strong>
            <div class="explanation">
                <strong>Explanation:</strong>
                ${question.explanation}
            </div>
        `;

    }else{

        selectedButton.classList.add("wrong");

        options[question.answer].classList.add("correct");

        feedback.className = "feedback wrong";

        feedback.innerHTML = `
            <strong>❌ WRONG!</strong>

            <div class="explanation">
                <strong>Correct Answer:</strong>
                ${question.options[question.answer]}
                <br><br>
                <strong>Explanation:</strong>
                ${question.explanation}
            </div>
        `;
    }

    document.getElementById("score").innerText = score;

    const progress =
        (answered / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";

    if(answered === questions.length){

        setTimeout(showFinalScore,500);

    }

}

function showFinalScore(){

    const finalScore =
        document.getElementById("finalScore");

    document.getElementById("finalNumber").innerText =
        score;

    let message = "";

    const percentage =
        (score / questions.length) * 100;

    if(percentage >= 90){

        message =
        "🏆 Excellent! You have a very strong understanding of Unit 1.";

    }else if(percentage >= 75){

        message =
        "👏 Very Good! Review a few topics and keep practicing.";

    }else if(percentage >= 50){

        message =
        "👍 Good effort! Review the notes and try the practice again.";

    }else{

        message =
        "📚 Keep studying! Review Unit 1 carefully and try again.";

    }

    document.getElementById("resultMessage").innerText =
        message;

    finalScore.style.display = "block";

    finalScore.scrollIntoView({
        behavior:"smooth"
    });
}

function restartQuiz(){

    score = 0;
    answered = 0;

    document.getElementById("score").innerText = "0";

    document.getElementById("progressBar").style.width = "0%";

    document.getElementById("finalScore").style.display = "none";

    loadQuiz();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}
